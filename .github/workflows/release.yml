name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $version = (Select-String -Path 'keykey2/installer/KeyKey2.iss' -Pattern '^AppVersion=(.+)$').Matches[0].Groups[1].Value.Trim()
            $tag = "v$version"
          }
          $version = $tag.TrimStart('v')
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "setup=KeyKey2-$version-x64-Setup.exe" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing $tag"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build the DLL
        shell: cmd
        run: |
          cd keykey2\KeyKey2
          build.cmd

      - name: Fetch the legacy KeyKey MSI payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ 'User-Agent' = 'keykey2-release'; 'Accept' = 'application/vnd.github+json' }
          $release = Invoke-RestMethod "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/v1.0.4" -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -like '*Setup.exe' } | Select-Object -First 1
          if (-not $asset) { throw 'The v1.0.4 Setup asset was not found.' }

          $setup = Join-Path $env:RUNNER_TEMP 'keykey-legacy-setup.exe'
          Invoke-WebRequest $asset.url -Headers @{ 'User-Agent' = 'keykey2-release'; 'Accept' = 'application/octet-stream' } -OutFile $setup

          # The v1.0.4 installer embeds keykey64.msi in its private payload. It
          # extracts the MSI to a temporary folder for the bundled engine setup,
          # so watch that folder and copy the file while it is still present.
          $msiPath = Join-Path $env:GITHUB_WORKSPACE 'keykey2\installer\keykey64.msi'
          $process = Start-Process -FilePath $setup `
              -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' `
              -PassThru

          $deadline = (Get-Date).AddMinutes(8)
          while (-not (Test-Path $msiPath) -and (Get-Date) -lt $deadline) {
              $candidate = Get-ChildItem -Path $env:TEMP -Directory -Filter 'is-*.tmp' -ErrorAction SilentlyContinue |
                  ForEach-Object { Join-Path $_.FullName 'keykey64.msi' } |
                  Where-Object { Test-Path $_ } |
                  Select-Object -First 1
              if ($candidate) {
                  Copy-Item -LiteralPath $candidate -Destination $msiPath -Force
                  Write-Host "Captured $candidate"
              }
              elseif ($process.HasExited -and $process.ExitCode -ne 0) {
                  throw "The legacy installer exited with code $($process.ExitCode) before the MSI was captured."
              }
              Start-Sleep -Milliseconds 200
          }

          if (-not (Test-Path $msiPath)) {
              throw 'keykey64.msi could not be captured from the legacy installer.'
          }

          if (-not $process.WaitForExit(300000)) {
              Write-Host 'The legacy installer is still running; stopping it.'
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

          $size = (Get-Item $msiPath).Length
          if ($size -lt 1MB) { throw "Captured keykey64.msi looks too small ($size bytes)." }
          Write-Host "Captured keykey64.msi ($size bytes)."

      - name: Build the Setup EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
              $iscc = (Get-Command iscc.exe -ErrorAction Stop).Source
          }
          & $iscc (Join-Path $env:GITHUB_WORKSPACE 'keykey2\installer\KeyKey2.iss')
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

          $setup = Join-Path $env:GITHUB_WORKSPACE "keykey2\release\${{ steps.version.outputs.setup }}"
          if (-not (Test-Path $setup)) { throw "Installer output not found: $setup" }
          Write-Host "Built $setup"

      - name: Write checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = Join-Path $env:GITHUB_WORKSPACE 'keykey2\release'
          $name = '${{ steps.version.outputs.setup }}'
          $path = Join-Path $rel $name
          if (-not (Test-Path $path)) { throw "Missing $path" }

          "$((Get-FileHash $path -Algorithm SHA256).Hash.ToLower())  $name" |
              Set-Content (Join-Path $rel 'SHA256SUMS.txt') -Encoding ASCII
          Get-Content (Join-Path $rel 'SHA256SUMS.txt')

      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ steps.version.outputs.tag }}'
          $title = "Yahoo! KeyKey 2 ${{ steps.version.outputs.version }} (x64)"
          $rel = Join-Path $env:GITHUB_WORKSPACE 'keykey2\release'
          $assets = @(
              (Join-Path $rel '${{ steps.version.outputs.setup }}'),
              (Join-Path $rel 'SHA256SUMS.txt')
          )
          $keep = @('${{ steps.version.outputs.setup }}', 'SHA256SUMS.txt')

          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
              Write-Host "Release $tag exists; updating assets."
              $existing = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name'
              foreach ($name in $existing) {
                  if ($keep -notcontains $name) {
                      Write-Host "Removing obsolete asset $name"
                      gh release delete-asset $tag $name --yes --repo $env:GITHUB_REPOSITORY
                  }
              }
              gh release upload $tag @assets --clobber --repo $env:GITHUB_REPOSITORY
          }
          else {
              gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --title $title `
                  --notes-file (Join-Path $rel 'RELEASE_NOTES.md')
          }
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the GitHub release failed.' }

          # Confirm the release still exists and carries exactly the expected assets.
          $published = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { throw "Release $tag could not be read back." }
          foreach ($required in $keep) {
              if ($published -notcontains $required) { throw "Release is missing $required." }
          }
          Write-Host "Published $tag"
