name: Build KeyKey TSF loader

on:
  push:
    branches: [ master, 'tsf/**', 'tsf-*' ]
    paths:
      - 'YahooKeyKey-Source-1.1.2528/Loaders/Windows-TSF/**'
      - 'YahooKeyKey-Source-1.1.2528/Loaders/Windows-IMM/BaseIMERPC/**'
      - '.github/workflows/build-tsf.yml'
  pull_request:
    paths:
      - 'YahooKeyKey-Source-1.1.2528/Loaders/Windows-TSF/**'
      - 'YahooKeyKey-Source-1.1.2528/Loaders/Windows-IMM/BaseIMERPC/**'
  workflow_dispatch:

jobs:
  build:
    name: MSVC ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            installer: install_x64.bat
          - arch: Win32
            installer: install_x86.bat

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build patched KeyKeyUI
        shell: pwsh
        run: |
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net20 -OutputDirectory refpkgs -NonInteractive | Out-Null
          $refDir = (Get-ChildItem refpkgs -Recurse -Filter mscorlib.dll | Select-Object -First 1).DirectoryName
          msbuild "YahooKeyKey-Source-1.1.2528\Loaders\Windows-IMM\BaseIMEUI\BaseIMEUI.csproj" `
            /p:Configuration=Release /p:TargetFrameworkVersion=v2.0 `
            /p:FrameworkPathOverride="$refDir" /p:SignAssembly=false /p:AssemblyOriginatorKeyFile= `
            /p:OutputPath="$PWD\keykeyui\out\" /v:minimal 2>&1 | Tee-Object -FilePath keykeyui.log
          $code = $LASTEXITCODE
          Select-String -Path keykeyui.log -Pattern 'error [A-Z]+\d+|error MSB\d+' |
            Select-Object -First 20 | ForEach-Object { Write-Host "::error file=keykeyui.log::$($_.Line.Trim())" }
          if ($code -ne 0) { exit $code }

      - name: Configure
        run: cmake -S YahooKeyKey-Source-1.1.2528/Loaders/Windows-TSF -B build -A ${{ matrix.arch }}

      - name: Build
        shell: pwsh
        run: |
          # Tee the compiler output so failures can be surfaced as annotations
          # (annotations are readable from the API, the raw step log is not).
          cmake --build build --config Release 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if (-not (Test-Path build.log)) { throw "no build log" }
          $errors = Select-String -Path build.log -Pattern 'error [A-Z]+\d+|fatal error|LNK\d{4}' |
                    Select-Object -First 40
          foreach ($e in $errors) { Write-Host "::error file=build.log::$($e.Line.Trim())" }
          if ($code -ne 0) {
            Write-Host "Build exited with $code"
            exit $code
          }

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.arch }}
          path: build.log
          if-no-files-found: ignore

      - name: Package
        shell: pwsh
        run: |
          $dll = Get-ChildItem build -Recurse -Filter KeyKeyTSF.dll | Select-Object -First 1
          if (-not $dll) { throw "KeyKeyTSF.dll was not produced" }
          Write-Host "Built $($dll.FullName) ($($dll.Length) bytes)"

          $packaging = "YahooKeyKey-Source-1.1.2528/Loaders/Windows-TSF/packaging"
          $stage = "stage/KeyKeyTSF-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item $dll.FullName "$stage/KeyKeyTSF.dll"
          Copy-Item "$packaging/${{ matrix.installer }}" "$stage/install.bat"
          Copy-Item "$packaging/uninstall.bat" $stage
          Copy-Item "$packaging/diagnose.ps1" $stage
          Copy-Item "$packaging/install-keykeyui.bat" $stage
          Copy-Item "$packaging/restore-keykeyui.bat" $stage
          Copy-Item "$packaging/README.txt" $stage

          if (Test-Path "keykeyui/out/KeyKeyUI.dll") { Copy-Item "keykeyui/out/KeyKeyUI.dll" $stage }
          $probe = Get-ChildItem build -Recurse -Filter KeyKeyProbe.exe | Select-Object -First 1
          if ($probe) { Copy-Item $probe.FullName $stage } else { Write-Host "::warning::KeyKeyProbe was not built" }

          Compress-Archive -Path "$stage/*" -DestinationPath "KeyKeyTSF-${{ matrix.arch }}.zip" -Force
          Get-ChildItem "KeyKeyTSF-${{ matrix.arch }}.zip" | Select-Object Name, Length

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: KeyKeyTSF-${{ matrix.arch }}
          path: KeyKeyTSF-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    name: Publish preview release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          REPO="${{ github.repository }}"
          exec > >(tee publish.log) 2>&1

          ls -R artifacts || true
          notes=$(cat <<'EOF'
          Text Services Framework front end for Yahoo! KeyKey, so the installed
          KeyKey engine can drive apps that only speak TSF (the Microsoft Store
          build of WhatsApp, other WinUI/UWP apps, the Windows 11 shell).

          Download KeyKeyTSF-x64.zip for 64-bit apps (WhatsApp, Office x64) and
          KeyKeyTSF-Win32.zip for 32-bit apps. Unzip it, right-click install.bat
          and run it as administrator, then add "Yahoo! KeyKey (TSF)" under
          Chinese (Traditional, Taiwan) in the language settings.

          If nothing happens, run diagnose.ps1 and read
          %LOCALAPPDATA%\KeyKeyTSF\keykeytsf.log.
          EOF
          )

          if gh release view tsf-preview --repo "$REPO" >/dev/null 2>&1; then
            gh release edit tsf-preview --repo "$REPO" --notes "$notes" --title "KeyKey TSF front end (preview)"
          else
            gh release create tsf-preview --repo "$REPO" --title "KeyKey TSF front end (preview)" --notes "$notes"
          fi
          gh release upload tsf-preview --repo "$REPO" artifacts/*/*.zip --clobber
          gh release view tsf-preview --repo "$REPO" --json assets --jq '.assets[] | "\(.name) \(.size)"'

      - name: Report publish failure
        if: failure()
        shell: bash
        run: |
          if [ -f publish.log ]; then
            tail -25 publish.log | while IFS= read -r line; do echo "::error::$line"; done
          fi
